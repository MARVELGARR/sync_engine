# Redis Broker Configuration
# For the Sync Engine real-time collaboration platform

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (AOF for durability)
appendonly yes
appendfsync everysec

# Streams - retain up to 10000 entries per stream
# Older entries are trimmed automatically
stream-node-max-bytes 4096
stream-node-max-entries 100

# Network
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
