worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ─── Rate Limiting ───────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ─── Upstreams ───────────────────────────────────────────
    upstream user_service {
        server user-service:3000;
    }

    upstream sync_cluster {
        # ip_hash;  # Uncomment for sticky sessions if needed
        server sync-service-1:4000;
        server sync-service-2:4001;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ─── Main Server ────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── Health Check ─────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","service":"gateway"}';
            add_header Content-Type application/json;
        }

        # ── REST API → user-service ──────────────────────────
        # CORS is owned by user-service (it echoes the specific
        # Origin + handles OPTIONS). The gateway just proxies so
        # headers are never duplicated with a wildcard.
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket → sync cluster ────────────────────────
        location /ws {
            proxy_pass http://sync_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Keep WebSocket connections alive for 24 hours
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Frontend → Next.js standalone (same-origin pages) ───
        # Must come after /api/ and /ws so those keep priority.
        # Browser hits :80 for everything: `/` pages, `/api/*`, `/ws`.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
